<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratório de Sistemas</title>
<meta name="author" content="Sérgio Santana">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body { margin: 0 }
img { max-width: 100% }
/* Layout: bancada de testes. Página inicial em grade de 15 casos, cada sistema com formulário à esquerda e registros à direita. */
:root {
  --bg: #F3F5F4; --surface: #FFFFFF; --sunk: #E8ECEA; --line: #D3DAD7;
  --fg: #17211E; --muted: #5B6863; --accent: #0E6B5C; --accent-fg: #FFFFFF; --accent-soft: #DCEFEA;
  --warn: #9A5B00; --warn-soft: #FFF1D6; --bad: #B3261E; --bad-soft: #FCE4E2; --ok: #1F7A3A; --ok-soft: #E0F3E5;
  --sans: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1513; --surface: #17201D; --sunk: #1F2A26; --line: #2E3B36;
  --fg: #E6EEEB; --muted: #9AAAA4; --accent: #4CC2AC; --accent-fg: #06201B; --accent-soft: #16352F;
  --warn: #F2B65A; --warn-soft: #3A2C12; --bad: #FF8A80; --bad-soft: #3D1A18; --ok: #7DD99A; --ok-soft: #173522; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #17201D; --sunk: #1F2A26; --line: #2E3B36;
  --fg: #E6EEEB; --muted: #9AAAA4; --accent: #4CC2AC; --accent-fg: #06201B; --accent-soft: #16352F;
  --warn: #F2B65A; --warn-soft: #3A2C12; --bad: #FF8A80; --bad-soft: #3D1A18; --ok: #7DD99A; --ok-soft: #173522; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2 }
h1 { font-size: 26px; font-weight: 700 }
h2 { font-size: 18px; font-weight: 600 }
h3 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
p { margin: 0 }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent) }
.muted { color: var(--muted) }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* Início */
.intro { display: grid; gap: 8px; margin-bottom: 22px; max-width: 70ch }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px }
.case { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; text-decoration: none; color: inherit; }
.case:hover { border-color: var(--accent) }
.case .num { width: 44px; height: 44px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 600 16px var(--mono) }
.case strong { display: block; font-size: 15px }
.case span { display: block; font-size: 13px; color: var(--muted) }
.howto { margin-top: 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 8px; max-width: 80ch }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 4px }

/* Sistema */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px }
.back { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; color: var(--muted); text-decoration: none; font-size: 14px }
.back:hover { color: var(--fg); border-color: var(--fg) }
.title { display: grid; gap: 2px; flex: 1; min-width: 0 }
.badge { font: 500 12px var(--mono); padding: 3px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap }
.problem { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; color: var(--muted); max-width: 100% }
.layout { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0 }
form { display: grid; gap: 10px }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 500 }
input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft) }
.primary { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 600 }
.primary:hover { filter: brightness(1.08) }
.errors { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: grid; gap: 2px }
.right { display: grid; gap: 16px; min-width: 0 }
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 560px }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--sunk); padding: 8px 10px; white-space: nowrap }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums }
td.act { white-space: nowrap; text-align: right }
.mini { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 13px; margin-left: 4px }
.mini:hover { border-color: var(--accent); color: var(--accent) }
.mini.danger:hover { border-color: var(--bad); color: var(--bad) }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--sunk); color: var(--muted) }
.pill.ok { background: var(--ok-soft); color: var(--ok) }
.pill.warn { background: var(--warn-soft); color: var(--warn) }
.pill.bad { background: var(--bad-soft); color: var(--bad) }
.pill.info { background: var(--accent-soft); color: var(--accent) }
.spec ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px }
.extra ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px }
.foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted) }
.reset { background: none; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; font-size: 13px; color: var(--muted) }
.reset.armed { border-color: var(--bad); color: var(--bad) }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 20 }
.empty { padding: 18px; text-align: center; color: var(--muted) }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out } @keyframes up { from { opacity: 0; transform: translate(-50%, 8px) } } }

.big { font-size: 22px; font-weight: 600; margin: 0 }
.left { display: grid; gap: 16px; min-width: 0 }
.problem h3 { margin-bottom: 4px }
.problem p { color: var(--fg); max-width: 90ch }
.listhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between }
.search { display: block; min-width: 0; flex: 0 1 240px }
.search input { padding: 7px 10px }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }
.count { font-size: 14px; font-weight: 400 }
.rn { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px }
.rn li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: baseline }
.rn .code { font: 600 12px var(--mono); color: var(--accent) }
.extra ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px }
.mini-t { border-collapse: collapse; width: 100%; min-width: 0; font-size: 13px }
.mini-t th, .mini-t td { padding: 4px 6px; border-top: 1px solid var(--line); text-align: left; background: none; text-transform: none; letter-spacing: 0; font-size: 13px }
.mini.armed { border-color: var(--bad); color: var(--bad) }
.credit { margin-top: 24px; font-size: 13px; color: var(--muted) }
.layout { grid-template-columns: minmax(0, 360px) minmax(0, 1fr) }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr) } }
td.act { white-space: normal; min-width: 130px }
td.act .mini { margin: 2px 0 2px 4px }
</style>

<style>
  .back { display: none !important; }

<script>
(function () {
  var CHAVE = "labsis:v2:caso-15";
  var SESSAO = "app-teste:sessao";
  var erros = 0, liberado = false;
  if (location.hash !== "#caso-15") history.replaceState(null, "", "#caso-15");

  function avisar(tipo, extra) {
    var m = { isStreamlitMessage: true, type: tipo };
    for (var k in (extra || {})) m[k] = extra[k];
    window.parent.postMessage(m, "*");
  }
  function hoje() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function altura() {
    avisar("streamlit:setFrameHeight", { height: Math.max(document.documentElement.scrollHeight, 600) });
  }
  function enviar() {
    if (!liberado) return;
    var reservas = null;
    try { reservas = JSON.parse(localStorage.getItem(CHAVE)); } catch (e) {}
    avisar("streamlit:setComponentValue", {
      value: { reservas: reservas, erros: erros, hoje: hoje(), t: Date.now() }, dataType: "json"
    });
  }

  // Toda gravação do caso 15 é repassada ao app.
  var gravar = Storage.prototype.setItem;
  Storage.prototype.setItem = function (k, v) {
    gravar.apply(this, arguments);
    if (k === CHAVE) setTimeout(enviar, 0);
  };

  // O app manda um código de sessão; se mudou, os dados voltam ao exemplo.
  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.type !== "streamlit:render") return;
    var sessao = (d.args || {}).sessao, atual = null;
    try { atual = localStorage.getItem(SESSAO); } catch (e) {}
    if (sessao && atual !== sessao) {
      try { localStorage.removeItem(CHAVE); gravar.call(localStorage, SESSAO, sessao); } catch (e) {}
      location.reload();
      return;
    }
    liberado = true;
    altura();
    enviar();
  });

  document.addEventListener("DOMContentLoaded", function () {
    avisar("streamlit:componentReady", { apiVersion: 1 });
    window.addEventListener("hashchange", function () {
      if (location.hash !== "#caso-15") location.hash = "#caso-15";
    });
    // Conta cada tentativa de registrar que terminou com mensagem de erro.
    document.addEventListener("submit", function () {
      setTimeout(function () {
        var e = document.getElementById("errs");
        if (e && !e.hidden) { erros++; enviar(); }
      }, 0);
    }, true);
    new MutationObserver(altura).observe(document.body, { subtree: true, childList: true });
  });
})();
</script>

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
// ---------- utilidades ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoje = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const HOJE = () => iso(hoje());
const parseD = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const addDias = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const emDias = (n) => addDias(HOJE(), n);
const dias = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const dow = (s) => parseD(s).getDay();
const br = (s) => { if (!s) return ""; const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; };
const brl = (n) => (isFinite(n) ? n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }) : "");
const num = (v) => (v === "" || v == null ? NaN : Number(v));
const horas = (a, b, passo = 60) => { const r = []; for (let m = a * 60; m <= b * 60; m += passo) r.push(`${pad(Math.floor(m / 60))}:${pad(m % 60)}`); return r; };
const hm = (s) => { const [h, m] = String(s).split(":").map(Number); return h * 60 + (m || 0); };
const mesAtual = () => HOJE().slice(0, 7);
const preco = (opts, nome) => (opts.find((o) => o[0] === nome) || [, 0])[1];
const obrig = (r, campos) => campos.filter(([k]) => r[k] === "" || r[k] == null).map(([, l]) => `Preencha o campo ${l}.`);
const soLetras = (v) => /^[A-Za-zÀ-ÿ' ]+$/.test(v);
const nomeOk = (v, min = 3, max = 60) => v.length >= min && v.length <= max && soLetras(v);
const telDig = (v) => String(v).replace(/\D/g, "").length;
const telOk = (v) => /^[\d\s()+-]+$/.test(v) && [10, 11].includes(telDig(v));
const proxDia = (n, ok = [1, 2, 3, 4, 5, 6]) => { let s = emDias(n); while (!ok.includes(dow(s))) s = addDias(s, 1); return s; };
const agoraHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const somaHoras = (t, h) => { const m = hm(t) + h * 60; return `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`; };
const DSEM = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];

// ---------- dados de apoio ----------
const PROD_PADARIA = [["Pão francês", 0.8], ["Pão doce", 1.5], ["Coxinha", 5], ["Bolo de milho", 25]];
const SERV_BARB = [["Corte", 35], ["Barba", 25], ["Corte e barba", 55]];
const LIVROS = [["Dom Casmurro", 2], ["O Cortiço", 1], ["Vidas Secas", 1], ["Capitães da Areia", 1], ["Memórias Póstumas de Brás Cubas", 1], ["A Hora da Estrela", 1]];
const SERV_PET = [["Banho", 50], ["Banho e tosa", 80], ["Tosa higiênica", 40]];
const PLANOS = [["Mensal", 90], ["Trimestral", 240], ["Anual", 840]];
const BAIRROS_ENT = [["Centro", 5], ["Siqueira Campos", 6], ["Jardins", 8], ["Farolândia", 9], ["Atalaia", 10]];
const MARMITAS = [["P", 18], ["M", 23], ["G", 27]];
const BEBIDAS = [["Nenhuma", 0], ["Refrigerante lata", 6], ["Suco natural", 7]];
const ARTESAOS = ["Dona Neide", "Seu Zé do Barro", "Maria das Rendas", "João Cestaria"];
const SERV_LAV = [["Lavar", 4], ["Lavar e passar", 6]];
const BIKES = [["Bike 01 comum", 10], ["Bike 02 comum", 10], ["Bike 03 comum", 10], ["Bike 04 elétrica", 25], ["Bike 05 elétrica", 25]];
const LABS = [["Lab 101", 40], ["Lab 102", 40], ["Lab 201", 40], ["Lab 202", 30]];
const PROC_DENT = [["Avaliação", 80], ["Limpeza", 150], ["Tratamento de canal", 600]];

const CASOS = [
// =============================== 01 PADARIA
{
  nome: "Padaria do bairro", entidade: "Encomenda", fem: true, regra: "De 1 a 50 unidades por encomenda",
  contexto: "Dona Lúcia tem uma padaria no Siqueira Campos. As encomendas chegavam pelo WhatsApp, se perdiam e às vezes eram preparadas duas vezes. A padaria funciona de segunda a sábado das 06:00 às 19:00 e aos domingos das 06:00 às 12:00. Este sistema registra as encomendas, calcula o valor e mostra o que produzir para o dia seguinte.",
  fields: [["cliente", "Cliente", "text"], ["telefone", "Telefone", "tel"], ["produto", "Produto", "select", PROD_PADARIA.map((p) => p[0])], ["quantidade", "Quantidade", "number"], ["retirada", "Data de retirada", "date"], ["horario", "Horário de retirada", "select", horas(6, 20)], ["obs", "Observação (opcional)", "text"]],
  rn: [
    "Cliente, telefone, produto, quantidade, data e horário de retirada são obrigatórios.",
    "O nome do cliente tem de 3 a 60 caracteres, só letras e espaços.",
    "O telefone tem DDD e 10 ou 11 dígitos.",
    "Cada encomenda aceita de 1 a 50 unidades, sempre em número inteiro.",
    "A data de retirada não pode ser anterior a hoje.",
    "A retirada pode ser marcada para no máximo 30 dias à frente.",
    "De segunda a sábado, a retirada é das 06:00 às 19:00.",
    "Aos domingos, a retirada é das 06:00 às 12:00.",
    "Valor = quantidade × preço. Pão francês R$ 0,80, pão doce R$ 1,50, coxinha R$ 5,00, bolo de milho R$ 25,00.",
    "Encomendas acima de R$ 100,00 ganham 5% de desconto. Encomendas de R$ 100,00 ou menos não têm desconto.",
    "Situação: Recebida → Em preparo → Pronta → Retirada, sem pular nenhuma etapa.",
    "Só encomendas na situação Recebida podem ser canceladas.",
    "Quando a encomenda fica Pronta, o aviso vai para o nome e o telefone do cliente daquela encomenda.",
    "A lista mostra as encomendas pela data e hora de retirada, da mais próxima para a mais distante.",
    "A busca encontra encomendas pelo nome do cliente, sem diferenciar maiúsculas de minúsculas.",
    "O contador de registros não conta encomendas canceladas.",
    "O painel Produção de amanhã soma as unidades por produto com retirada amanhã, sem contar canceladas.",
    "A observação aceita até 100 caracteres.",
    "Excluir uma encomenda pede confirmação.",
  ],
  statuses: ["Recebida", "Em preparo", "Pronta", "Retirada"], cancel: "Cancelada", cancelBtn: "Cancelar",
  next: (r) => ({ "Recebida": "Pronta", "Em preparo": "Pronta", "Pronta": "Retirada" }[r.status]),
  canCancel: (r) => !["Retirada", "Cancelada"].includes(r.status),
  validate(r) {
    const e = obrig(r, [["cliente", "Cliente"], ["telefone", "Telefone"], ["produto", "Produto"], ["quantidade", "Quantidade"], ["retirada", "Data de retirada"], ["horario", "Horário"]]);
    if (r.cliente && (r.cliente.length < 3 || r.cliente.length > 60)) e.push("O nome do cliente deve ter de 3 a 60 caracteres.");
    const q = num(r.quantidade);
    if (r.quantidade !== "" && (q < 1 || q > 51)) e.push("A quantidade deve ficar entre 1 e 50 unidades.");
    const h = Number(String(r.horario).slice(0, 2));
    if (r.horario && (h < 6 || h > 20)) e.push("A retirada é das 06:00 às 19:00.");
    if (r.obs && r.obs.length > 100) e.push("A observação aceita até 100 caracteres.");
    return e;
  },
  total(r) { const t = num(r.quantidade) * preco(PROD_PADARIA, r.produto); return t >= 100 ? t * 0.95 : t; },
  aviso: { "Pronta": (r, all) => `Aviso enviado para ${all[0].cliente} no telefone ${all[0].telefone}.` },
  sort: (l) => l.slice().sort((a, b) => b.criado.localeCompare(a.criado)),
  search: { keys: ["cliente"], sens: true },
  count: (l) => l.filter((x) => x.status !== "Cancelada").length,
  delConfirm: true,
  panels(all) {
    const am = emDias(1), t = {};
    all.filter((x) => x.retirada === am).forEach((x) => (t[x.produto] = (t[x.produto] || 0) + num(x.quantidade)));
    const k = Object.keys(t);
    return [{ title: "Produção de amanhã", html: k.length ? `<ul>${k.map((p) => `<li>${esc(p)}: <span class="mono">${t[p]}</span> un.</li>`).join("")}</ul>` : `<p class="muted">Nada para amanhã.</p>` }];
  },
  cols: [["Cliente", (r) => esc(r.cliente)], ["Produto", (r) => esc(r.produto)], ["Qtd", (r) => r.quantidade], ["Retirada", (r) => `${br(r.retirada)} ${r.horario}`], ["Total", (r, c) => brl(c.total(r))], ["Situação", (r) => pill(r.status)]],
  seed: () => [
    { cliente: "Marta Souza", telefone: "79 99812-4410", produto: "Pão francês", quantidade: 20, retirada: emDias(1), horario: "07:00", status: "Recebida" },
    { cliente: "Carlos Menezes", telefone: "79 99655-1032", produto: "Bolo de milho", quantidade: 2, retirada: emDias(2), horario: "16:00", status: "Recebida" },
    { cliente: "Lia Prado", telefone: "79 99120-7781", produto: "Coxinha", quantidade: 30, retirada: emDias(0), horario: "17:00", status: "Em preparo" },
    { cliente: "Edson Lima", telefone: "79 98877-2200", produto: "Pão doce", quantidade: 12, retirada: emDias(0), horario: "08:00", status: "Pronta" },
    { cliente: "Rita Campos", telefone: "79 99301-5576", produto: "Coxinha", quantidade: 15, retirada: emDias(1), horario: "09:00", status: "Cancelada" },
  ],
},
// =============================== 02 BARBEARIA
{

// ---------- interface ----------
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3600); }
function pill(t) {
  const tone = /Atrasad|Vencid|baixo|Esgotad|Cancelad|Faltou|Recusad|Em atraso|Abandonad|Inativa|Trancad/.test(t) ? "bad"
    : /Pront|Entregu|Retirad|Devolvid|Atendid|Pago|Matriculad|Normal|Disponível|Ativa/.test(t) ? "ok"
    : /preparo|banho|Lavando|conserto|Saiu|Em uso|Confirmad|Aprovad|Vence logo|Pendente/.test(t) ? "warn" : "info";
  return `<span class="pill ${tone}">${esc(t)}</span>`;
}

const KEY = (i) => `labsis:v2:caso-${i + 1}`;
const mem = {}, busca = {};
function seedOf(i) {
  const c = CASOS[i];
  return c.seed().map((r, k) => ({ id: `s${k}`, criado: r.criado || `${HOJE()}T${pad(8 + k)}:00`, status: r.status ?? (c.statuses[0] || ""), ...r }));
}
function load(i) {
  if (mem[i]) return mem[i];
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY(i))); } catch (e) {}
  if (!Array.isArray(d)) d = seedOf(i);
  return (mem[i] = d);
}
function save(i) { try { localStorage.setItem(KEY(i), JSON.stringify(mem[i])); } catch (e) {} }

function sistema(i) {
  const c = CASOS[i], all = load(i);
  document.title = `${c.nome} · Laboratório de Sistemas`;
  const q = busca[i] || "";
  const campo = ([k, label, type, opts, def, step]) => {
    const id = `f-${i}-${k}`, v = def ? def() : "";
    if (type === "select") return `<label for="${id}">${label}<select id="${id}" name="${k}"><option value="">Selecione</option>${opts.map((o) => `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
    return `<label for="${id}">${label}<input id="${id}" name="${k}" type="${type}" value="${esc(v)}"${type === "number" ? ` step="${step || "any"}"` : ""}></label>`;
  };
  const nextOf = (r) => (c.next ? c.next(r) : (() => { const k = c.statuses.indexOf(r.status); return k > -1 && k < c.statuses.length - 1 ? c.statuses[k + 1] : null; })());
  const canCancel = (r) => c.cancel && (c.canCancel ? c.canCancel(r) : r.status === c.statuses[0]);
  const filtra = (r) => {
    if (!q) return true;
    const txt = c.search.keys.map((k) => String(r[k] ?? "")).join(" ");
    return c.search.sens ? txt.includes(q) : txt.toLowerCase().includes(q.toLowerCase());
  };
  const lista = c.sort(all, c).filter(filtra);
  const rows = lista.map((r) => {
    const acts = [];
    const nx = nextOf(r);
    if (nx) acts.push(`<button class="mini" data-act="adv" data-id="${r.id}">${esc(nx)}</button>`);
    (c.actions || []).forEach((a, k) => a.show(r) && acts.push(`<button class="mini" data-act="x${k}" data-id="${r.id}">${esc(a.label)}</button>`));
    if (canCancel(r)) acts.push(`<button class="mini danger" data-act="cancel" data-id="${r.id}">${esc(c.cancelBtn)}</button>`);
    acts.push(`<button class="mini danger" data-act="del" data-id="${r.id}">Excluir</button>`);
    return `<tr>${c.cols.map(([, f]) => `<td>${f(r, c, all)}</td>`).join("")}<td class="act">${acts.join("")}</td></tr>`;
  }).join("");
  const pnls = c.panels ? c.panels(all, c) : [];
  const ent = c.entidade.toLowerCase();
  $("#app").innerHTML = `
  <div class="top">
    <a class="back" href="#">← Todos os casos</a>
    <div class="title"><span class="eyebrow">Caso ${pad(i + 1)}</span><h1>${esc(c.nome)}</h1></div>
    <span class="badge">versão 1.0</span>
  </div>
  <section class="problem"><h3>Contexto</h3><p>${esc(c.contexto)}</p></section>
  <div class="layout">
    <div class="left">
      <section class="panel" aria-labelledby="novo-${i}">
        <h2 id="novo-${i}">${c.fem ? "Nova" : "Novo"} ${esc(ent)}</h2>
        <form id="form" novalidate>
          ${c.fields.map(campo).join("")}
          <div class="errors" id="errs" hidden></div>
          <button class="primary" type="submit">Registrar ${esc(ent)}</button>
        </form>
      </section>
      ${pnls.map((p) => `<section class="panel extra"><h3>${esc(p.title)}</h3>${p.html}</section>`).join("")}
    </div>
    <div class="right">
      <section class="panel">
        <div class="listhead">
          <h2>Registros <span class="muted mono count">(${c.count(all, c)})</span></h2>
          <label class="search" for="q-${i}"><span class="sr">Buscar</span><input id="q-${i}" type="search" placeholder="Buscar" value="${esc(q)}"></label>
        </div>
        <div class="tablebox"><table>
          <thead><tr>${c.cols.map(([h]) => `<th>${h}</th>`).join("")}<th></th></tr></thead>
          <tbody>${rows || `<tr><td class="empty" colspan="${c.cols.length + 1}">${q ? "Nada encontrado para essa busca." : "Nenhum registro ainda. Use o formulário para cadastrar o primeiro."}</td></tr>`}</tbody>
        </table></div>
      </section>
      <section class="panel spec">
        <h3>Regras de negócio</h3>
        <ol class="rn">${c.rn.map((s, k) => `<li><span class="code">RN${pad(k + 1)}</span><span>${esc(s)}</span></li>`).join("")}</ol>
      </section>
      <div class="foot">
        <span>Hoje: <span class="mono">${br(HOJE())}</span>, ${DSEM[hoje().getDay()]}. Dados salvos neste navegador.</span>
        <button class="reset" id="reset" type="button">Restaurar dados de exemplo</button>
      </div>
    </div>
  </div>`;

  $("#form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const r = {};
    new FormData(ev.target).forEach((v, k) => (r[k] = typeof v === "string" ? v.trim() : v));
    const errs = c.validate(r, all);
    const box = $("#errs");
    if (errs.length) { box.innerHTML = errs.map((e) => `<span>${esc(e)}</span>`).join(""); box.hidden = false; return; }
    const now = new Date();
    let rec = { id: `r${now.getTime()}`, criado: `${iso(now)}T${pad(now.getHours())}:${pad(now.getMinutes())}`, status: c.statuses[0] || "", ...r };
    c.fields.forEach(([k, , t]) => { if (t === "number" && rec[k] !== "") rec[k] = Number(rec[k]); });
    if (c.novo) rec = c.novo(rec, all);
    all.push(rec); save(i); sistema(i);
    toast(`${c.entidade} registrad${c.fem ? "a" : "o"}.`);
  });
  const qi = $(`#q-${i}`);
  qi.addEventListener("input", () => { busca[i] = qi.value; const pos = qi.selectionStart; sistema(i); const n = $(`#q-${i}`); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} });
  $("#app").querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
    const k = all.findIndex((x) => x.id === b.dataset.id); if (k < 0) return;
    const r = all[k], act = b.dataset.act; let msg = "";
    if (act === "del") {
      if (c.delConfirm && !b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmar exclusão"; return; }
      const err = c.canDelete ? c.canDelete(r) : null;
      if (err) { toast(err); return; }
      all.splice(k, 1); save(i); sistema(i); toast("Registro excluído."); return;
    }
    if (act === "adv") { r.status = nextOf(r); c.onStatus && c.onStatus(r); msg = (c.aviso && c.aviso[r.status] && c.aviso[r.status](r, all)) || `Situação alterada para ${r.status}.`; }
    else if (act === "cancel") { r.status = c.cancel; msg = `Situação alterada para ${r.status}.`; }
    else { const out = c.actions[Number(act.slice(1))].run(r, all); if (out && out.erro) { toast(out.erro); return; } msg = out; }
    save(i); sistema(i); if (msg) toast(msg);
  }));
  const rb = $("#reset");
  rb.addEventListener("click", () => {
    if (!rb.classList.contains("armed")) { rb.classList.add("armed"); rb.textContent = "Confirmar: apagar e restaurar"; setTimeout(() => { if (rb.isConnected) { rb.classList.remove("armed"); rb.textContent = "Restaurar dados de exemplo"; } }, 4000); return; }
    mem[i] = seedOf(i); busca[i] = ""; save(i); sistema(i); toast("Dados de exemplo restaurados.");
  });
}

  const m = location.hash.match(/^#caso-(\d+)$/);
  const n = m ? Number(m[1]) : 0;
  if (n >= 1 && n <= CASOS.length) sistema(n - 1); else home();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();

</script>
